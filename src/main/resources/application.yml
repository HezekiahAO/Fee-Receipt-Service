spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fee-receipt-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fee_receipt_db?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8081}
